server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: td-manage-after
  # Credentials are supplied through environment variables so that no secret is
  # ever committed. See "管理后台后端" in README.md for the local setup.
  #   DB_URL      -- JDBC connection string
  #   DB_USERNAME -- MySQL user
  #   DB_PASSWORD -- MySQL password (no default on purpose)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/td_manage?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
